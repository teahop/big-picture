# Pipeline parameters. Every random process reads its seed from here.
seed: 20261109

terrain:
  grid_size: 128           # cells per side
  margin: 0.25             # padding around the node bounding box (layout units)
  bandwidth_level0: 0.07   # Gaussian sigma for Level 0 nodes (layout units); nodes sit about 0.16 apart
  bandwidth_per_level: 0.75 # sigma multiplier for each deeper level (level 1 = x0.75); peaks do not stack, so wider is safe
  combine: max             # max: each point takes the tallest node's kernel (peaks show their own size); sum: kernels add up
  height_exponent: 0.5     # peak height = (size / largest at that level) ** this; 1 = proportional, 0.5 = square root


layout:                    # industry layout at every level (pipeline/src/imap/layout_joint.py)
  weight_occupational: 0.6 # shared-occupation similarity (TF-IDF weighted)
  weight_semantic: 0.4     # text-embedding similarity
  level0: {k: 4, far_weight: 0.05}    # k nearest industries held at full weight; far_weight for every other pair
  level1: {k: 6, far_weight: 0.005}
  anchor: 0.3              # Level 1 pull toward its sector's position, relative to a node's neighbour weight
  min_sep_level1: 0.02     # Level 1 nodes are pushed apart to at least this (layout units)
  iters: 400
