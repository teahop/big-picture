# Viewer settings that are expected to be tuned by eye. Terrain colours are
# tokens in web/src/style.css (--terrain-ground, --terrain-peak).

peak_height: 4.2     # world height of the highest point (the map is 16 units across): broad, tall rolling hills

footprint:           # how a footprint's entries become weights (the page and the private pipeline both use these)
  half_life_years: 8       # a role's weight halves for every this many years since it ended
  degree_years: 2          # a degree counts as this many years, with no decay
  touched_threshold: 0.03  # a node is touched when it holds at least this share of the footprint's total weight
