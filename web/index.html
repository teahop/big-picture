<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="%DISPLAY_NAME%: industry and research terrain" />
    <title>%DISPLAY_NAME%</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1 id="title"></h1>
      <fieldset class="layers">
        <legend class="sr">Layer mode</legend>
        <label><input type="radio" name="layer" value="industry" /> <span>Industry</span></label>
        <label><input type="radio" name="layer" value="research" /> <span>Research</span></label>
        <label><input type="radio" name="layer" value="stacked" /> <span>Stacked</span></label>
        <label><input type="radio" name="layer" value="overlaid" /> <span>Overlaid</span></label>
      </fieldset>
      <label class="size">Industry size
        <select id="size-industry" aria-describedby="size-note"><option>Employment</option></select>
      </label>
      <label class="size">Research size
        <select id="size-research">
          <option value="works">Publications</option>
          <option value="rd">R&amp;D dollars</option>
        </select>
      </label>
      <label class="size">Detail
        <select id="lod">
          <option value="auto">Auto (by zoom)</option>
          <option value="0">Level 0: sectors, fields</option>
          <option value="1">Level 1: industries, subfields</option>
          <option value="2">Level 2: deep zones</option>
        </select>
      </label>
      <label class="search"><span class="sr">Search nodes</span>
        <input id="search" type="search" placeholder="Search" autocomplete="off" />
      </label>
      <span id="search-count" aria-live="polite"></span>
      <button id="mode" type="button" aria-pressed="false">Switch to 2D map</button>
    </header>
    <p id="size-note" class="sr">Industry value added is planned for a later phase, so employment is the only industry size measure.</p>
    <p id="notice" role="status"></p>
    <main>
      <section class="map" aria-label="Terrain map">
        <div id="view-3d" class="view"></div>
        <div id="labels" class="labels" aria-hidden="true"></div>
        <div id="view-2d" class="view" hidden></div>
      </section>
      <aside>
        <div id="details" aria-live="polite"></div>
        <div id="group-ind"><h3>Industry sectors by employment</h3><ul id="list-ind"></ul></div>
        <div id="group-fld"><h3>Research fields</h3><ul id="list-fld"></ul></div>
        <p id="source" class="source"></p>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
