# Pipeline parameters. Every random process reads its seed from here.
seed: 20261109

terrain:
  grid_size: 128           # cells per side
  margin: 0.75             # padding around the node bounding box (layout units); wide enough that edge hills fade out inside the grid
  bandwidth_level0: 0.23   # Gaussian sigma for Level 0 nodes (layout units); sectors sit about 0.6 apart on the grid, so hills cover most of the land
  bandwidth_per_level: 0.55 # sigma multiplier for each deeper level (level 1 = x0.55)
  combine: pmean           # pmean: power mean of the kernels (peaks keep their own size, rounded saddles between); max: tallest only; sum: kernels add up
  hill_stretch_max: 2.6    # hills are ridges up to this many times as long as wide (same area), each with its own direction
  pmean_power: 4           # higher = closer to max (sharper creases), lower = softer saddles
  height_exponent: 0.35    # peak height = (size / largest at that level) ** this; 1 = proportional, 0.5 = square root; lower lifts small sectors into real hills


layout_axes:               # v3 layout (pipeline/src/imap/layout_axes.py): growth left to right, size front (small) to back (large)
  growth_clip_pct: [5, 95] # growth scale runs between these percentiles of each level; values beyond sit at the edge
  size_clip_low_pct: 5     # size (log) scale starts at this percentile, so a few tiny industries do not stretch it
  pull: 0.3                # Level 1 moves this share of the way toward its sector, deep: toward its Level 1 parent
  min_sep: {"0": 0.26, "1": 0.06, "2": 0.045}   # separation pass: no two hills closer than this (layout units; map spans -1..1)

layout:                    # v2 similarity layout, kept for comparison (`imap layout --method joint`; pipeline/src/imap/layout_joint.py)
  weight_occupational: 0.6 # shared-occupation similarity (TF-IDF weighted)
  weight_semantic: 0.4     # text-embedding similarity
  level0: {k: 4, far_weight: 0.05}    # k nearest industries held at full weight; far_weight for every other pair
  level1: {k: 6, far_weight: 0.005}
  anchor: 0.3              # Level 1 pull toward its sector's position, relative to a node's neighbour weight
  min_sep_level0: 0.44     # sectors are pushed apart to at least this (layout units; the map spans -1..1), so hills spread out
  level0_grid: {rows: 5, cols: 4, jitter: 0.13}   # sectors take the nearest spots of a staggered grid that tiles the map (axes carry no meaning), lightly jittered
  min_sep_level1: 0.07     # Level 1 nodes are pushed apart to at least this
  iters: 400
