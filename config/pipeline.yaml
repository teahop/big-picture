# Pipeline parameters. Every random process reads its seed from here.
seed: 20261109

terrain:
  grid_size: 128           # cells per side
  margin: 0.25             # padding around the node bounding box (layout units)
  bandwidth_level0: 0.12   # Gaussian sigma for Level 0 nodes (layout units)
  bandwidth_per_level: 0.5 # sigma multiplier for each deeper level (level 1 = x0.5)
  research_relative_height: 1.0  # peak of the largest Level 0 field relative to the largest Level 0 industry

bridge:
  weight_occupational: 0.6
  weight_semantic: 0.4
  exclude_postsecondary_teaching: true
