[project]
name = "imap"
version = "0.1.0"
description = "Industry map data pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.9.1",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
]

[project.scripts]
imap = "imap.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
